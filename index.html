<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Maximilien Ledoux</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="calculator">
        <div id="display"></div>
        <div id="keyboard">
            <div id="backspace" class="key">X</div>
            <div id="clear" class="key">C</div>
            <div id="divide" class="key operator">/</div>
            <div class="key digit">7</div>
            <div class="key digit">8</div>
            <div class="key digit">9</div>
            <div id="multiply" class="key operator">*</div>
            <div class="key digit">4</div>
            <div class="key digit">5</div>
            <div class="key digit">6</div>
            <div id="subtract" class="key operator">-</div>
            <div class="key digit">1</div>
            <div class="key digit">2</div>
            <div class="key digit">3</div>
            <div id="add" class="key operator">+</div>
            <div id="zero" class="key digit">0</div>
            <div id="decimal" class="key">.</div>
            <div id="equals" class="key operator">=</div>
        </div>
    </div>
</body>

</html>
